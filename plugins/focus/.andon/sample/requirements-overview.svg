<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <title>見本: 会員検索（PROJ-123）の利用者と要件</title>
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#0f172a">会員検索（PROJ-123）: 利用者と要件</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-size="14" fill="#0f172a">
    <rect x="24" y="72" width="150" height="52" rx="8" fill="#f8fafc" stroke="#0f172a"/>
    <text x="99" y="104" text-anchor="middle">窓口の担当者</text>
    <rect x="24" y="172" width="150" height="52" rx="8" fill="#f8fafc" stroke="#0f172a"/>
    <text x="99" y="204" text-anchor="middle">管理者</text>
    <rect x="280" y="56" width="260" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="296" y="88">＋ FR-1 名前と電話番号で検索する</text>
    <rect x="280" y="124" width="260" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="296" y="156">＋ FR-2 退会済みの会員を絞り込む</text>
    <rect x="280" y="192" width="260" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="296" y="224">△ FR-3 一覧を CSV で出力する</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M174 98 L278 82"/>
    <path d="M174 98 L278 150"/>
    <path d="M174 198 L278 150"/>
    <path d="M174 198 L278 218"/>
  </g>
  <g font-size="13" fill="#334155">
    <text x="568" y="88">凡例</text>
    <text x="568" y="114">＋ 追加</text>
    <text x="568" y="138">△ 変更</text>
    <text x="568" y="162">（Q2 の回答待ち: FR-3）</text>
  </g>
</svg>
